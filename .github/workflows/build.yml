name: Build Kernel Module

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y clang llvm lld gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu bc flex bison libssl-dev libelf-dev python3 git

    - name: Clone full kernel source
      run: |
        git clone \
          --branch oneplus/sm8750_b_16.0.0_oneplus_13 \
          https://github.com/YDJ521/android_kernel_common_oneplus_sm8750.git \
          kernel_src

    - name: Prepare kernel build
      working-directory: kernel_src
      run: |
        make gki_defconfig || make defconfig
        make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- modules_prepare -j$(nproc)

    - name: Patch vermagic to match device
      working-directory: kernel_src
      run: |
        echo '#define UTS_RELEASE "6.6.89-android15-8-g7e1f3c083cc6-abogki467167594-4k"' > include/generated/utsrelease.h
        cat include/generated/utsrelease.h

    - name: Build module via Kbuild
      run: |
        mkdir -p kernel_src/drivers/misc
        cp src/oplus_unlock.c kernel_src/drivers/misc/oplus_unlock.c
        cat > kernel_src/drivers/misc/Kbuild << 'KBUILD'
        obj-m += oplus_unlock.o
        KBUILD
        cd kernel_src
        make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
          KBUILD_MODPOST_WARN=1 \
          M=$(pwd)/drivers/misc \
          modules -j$(nproc) 2>&1
        cp drivers/misc/oplus_unlock.ko $GITHUB_WORKSPACE/oplus_unlock.ko

    - name: Verify vermagic
      run: |
        strings oplus_unlock.ko | grep "6.6.89"
        echo "Expected: 6.6.89-android15-8-g7e1f3c083cc6-abogki467167594-4k"

    - name: Package for KernelSU
      run: |
        mkdir -p package
        cp oplus_unlock.ko package/
        cp service.sh package/
        cp module.prop package/
        cp profile.conf package/
        touch package/skip_mount
        cd package
        zip -r ../oplus_unlock-kernelsu.zip .

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: oplus_unlock-module
        path: |
          oplus_unlock.ko
          oplus_unlock-kernelsu.zip
        retention-days: 7
