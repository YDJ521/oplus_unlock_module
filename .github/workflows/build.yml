name: Build Kernel Module

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y clang llvm lld gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu bc flex bison libssl-dev libelf-dev python3 git

    - name: Clone full kernel source
      run: |
        git clone --depth 1 \
          --branch oneplus/sm8750_b_16.0.0_oneplus_13 \
          https://github.com/YDJ521/android_kernel_common_oneplus_sm8750.git \
          kernel_src

    - name: Prepare kernel headers
      working-directory: kernel_src
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        
        if [ -f arch/arm64/configs/gki_defconfig ]; then
          make gki_defconfig
        elif [ -f arch/arm64/configs/vendor/gki_defconfig ]; then
          make vendor/gki_defconfig
        else
          make defconfig
        fi
        
        make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- modules_prepare -j$(nproc)

    - name: Build module
      run: |
        cd src
        KHEADERS=$(cd ../kernel_src && pwd)
        
        clang --target=aarch64-linux-gnu \
          -std=gnu11 -O2 \
          -D__KERNEL__ -DMODULE \
          -fno-pic -fno-PIE -fno-common -fno-builtin \
          -fasynchronous-unwind-tables \
          -fno-delete-null-pointer-checks \
          -ffixed-x18 \
          -mbranch-protection=pac-ret \
          -mgeneral-regs-only \
          -mcmodel=large \
          -fsanitize=kcfi \
          -I${KHEADERS}/include \
          -I${KHEADERS}/arch/arm64/include \
          -c oplus_unlock.c -o oplus_unlock.o

        clang --target=aarch64-linux-gnu \
          -std=gnu11 -O2 \
          -D__KERNEL__ -DMODULE \
          -fno-pic -fno-PIE -fno-common -fno-builtin \
          -fasynchronous-unwind-tables \
          -fno-delete-null-pointer-checks \
          -ffixed-x18 \
          -mbranch-protection=pac-ret \
          -mgeneral-regs-only \
          -mcmodel=large \
          -fsanitize=kcfi \
          -I${KHEADERS}/include \
          -I${KHEADERS}/arch/arm64/include \
          -nostdlib -Wl,--build-id=none -shared \
          -o oplus_unlock.ko oplus_unlock.o

        echo "=== Build complete ==="
        llvm-readelf -p .modinfo oplus_unlock.ko | grep -E "vermagic|filename"

    - name: Package for KernelSU
      run: |
        mkdir -p package
        cp src/oplus_unlock.ko package/
        cp service.sh package/
        cp module.prop package/
        cp profile.conf package/
        touch package/skip_mount
        cd package
        zip -r ../oplus_unlock-kernelsu.zip .

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: oplus_unlock-module
        path: |
          src/oplus_unlock.ko
          oplus_unlock-kernelsu.zip
        retention-days: 7
